# This rule is not used by the project kube-workspaces-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the kubeworkspaces.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kube-workspaces-controller
    app.kubernetes.io/managed-by: kustomize
  name: workspace-editor-role
rules:
- apiGroups:
  - kubeworkspaces.io
  resources:
  - workspaces
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kubeworkspaces.io
  resources:
  - workspaces/status
  verbs:
  - get
